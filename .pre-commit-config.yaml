# .pre-commit-config.yaml
#
# Purpose:
# Enforces code formatting, quality, and standards check on git commits.
#
# Dependencies:
# pre-commit framework
#
# Usage:
# Run: pre-commit install
#
# Notes:
# Runs Ruff, Black, and basic system checks.
#
# Future Improvements:
# - Add secret detection plugins (TruffleHog/git-secrets)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.2
    hooks:
      - id: ruff
        args: [ --fix ]

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3

